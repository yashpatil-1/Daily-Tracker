<!doctype html><html lang="en" data-t="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B0F14"><title>Life OS</title>
<style>
:root{--bg:#0B0F14;--cd:#131b28;--in:#0d131c;--bd:#1f2a3c;--tx:#F8FAFC;--t2:#CBD5E1;--mu:#64748B;--p:#3B82F6;--s:#8B5CF6;--a:#10B981;--w:#F59E0B;--d:#EF4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=light]{--bg:#F1F5F9;--cd:#fff;--in:#F1F5F9;--bd:#dbe3ee;--tx:#0F172A;--t2:#334155;--mu:#64748B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:22px;margin:0}h2{font-size:13px;color:var(--mu);font-weight:600;margin:20px 2px 8px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 1px 8px #0003}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.mu{color:var(--mu);font-size:13px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,select,input{font:inherit;color:inherit}
button{background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;transition:transform .1s,background .2s}
button:active{transform:scale(.95)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.pr{background:var(--p);border-color:var(--p);color:#fff}.ok{background:var(--a);border-color:var(--a);color:#04140d}.no{color:var(--d)}
input,select{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:9px;min-height:40px;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btns button{flex:1;min-width:64px}
.bar{height:8px;background:var(--in);border-radius:9px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p);border-radius:9px;transition:width .4s}
.done{border-color:var(--a)}.chk{width:34px;height:34px;min-height:34px;border-radius:50%;padding:0}.chk.on{background:var(--a);border-color:var(--a);color:#04140d}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;max-width:100px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu)}nav button.on{color:var(--p)}
nav svg,.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:8px 4px}.tabs .on{background:var(--p);color:#fff;border-color:var(--p)}
.ai{background:linear-gradient(135deg,#3B82F622,#8B5CF622);border-color:#8B5CF666}.big{font-size:26px;font-weight:700}
.bub{padding:10px 12px;border-radius:14px;margin:6px 0;max-width:88%;white-space:pre-wrap}.u{background:var(--p);color:#fff;margin-left:auto}.b{background:var(--in);border:1px solid var(--bd)}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hm button{aspect-ratio:1;min-height:0;padding:0;border-radius:6px;font-size:10px;color:var(--t2)}
.float{position:fixed;pointer-events:none;color:var(--a);font-weight:700;animation:fl .9s ease-out forwards;z-index:20}@keyframes fl{to{transform:translateY(-46px);opacity:0}}
summary{color:var(--mu);font-size:13px;cursor:pointer;margin-top:8px}.h{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:2px 0}.h button{min-height:30px;padding:2px 10px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:13px;max-width:90%}
.v{animation:vi .25s}@keyframes vi{from{opacity:0;transform:translateY(6px)}}
@media(min-width:900px){#app{max-width:900px;padding-left:110px}nav{top:0;bottom:auto;right:auto;width:96px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--bd);padding-top:24px}nav button{max-width:none;flex:0}.cols{columns:2;column-gap:10px}.cols>*{break-inside:avoid}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="app" aria-live="polite"></main><nav id="nav" aria-label="Main"></nav>
<script>
const $=s=>document.querySelector(s),K='lifeos-v1',DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const T0=()=>dk(new Date()),addD=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dk(d)},dow=k=>(new Date(k+'T12:00:00').getDay()+6)%7;
const sum=a=>a.reduce((s,e)=>s+e.v,0),avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,mins=t=>{const[h,m]=t.split(':');return +h*60+ +m},hm=m=>`${Math.floor(m/60)}h ${String(Math.round(m%60)).padStart(2,'0')}m`;
const tm=ms=>new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const IC={home:'M3 11l9-8 9 8v10H3z',stats:'M5 21V10M12 21V4M19 21v-8',gym:'M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8',tasks:'M4 12l5 5L20 6',ai:'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',set:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3'};
const ico=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const EX={'Chest + Triceps':['Bench Press','Incline Dumbbell Press','Cable Fly','Triceps Pushdown'],'Back + Biceps':['Lat Pulldown','Barbell Row','Bicep Curl'],'Legs':['Squat','Leg Press','Leg Curl'],'Shoulders + Abs':['Overhead Press','Lateral Raise','Cable Crunch']};
function fresh(){const sc=['Chest + Triceps','Back + Biceps','Legs','Shoulders + Abs','Chest + Triceps','Back + Biceps / Cardio','Rest'];
 return{v:1,demo:false,set:{name:'Yash',theme:'dark',waterGoal:3000,protGoal:100,runGoal:5,readGoal:5,w:{wake:10,bed:5,water:15,run:10,work:15,gym:15,read:10,self:10,prot:10},lab:{read:'Reading',self:'Self work'}},
 days:{},tasks:[],habits:[],inbox:[],chat:[],hist:[],sched:sc.map(n=>({n,ex:EX[n]||(n.includes('Back')?EX['Back + Biceps']:[])}))}}
function demo(S){let x=7;const r=()=>(x=(x*16807)%2147483647)/2147483647;const e=(t,v)=>({t,v});
 for(let i=30;i>=1;i--){const k=addD(T0(),-i),b=new Date(k+'T08:00:00').getTime(),d={water:[],prot:[],run:[],read:[],meals:{},custom:{}};
 let w=1500+r()*2000;while(w>0){const v=r()>.5?500:250;d.water.push(e(b+d.water.length*9e5,v));w-=v}
 let p=40+r()*70;while(p>0){d.prot.push(e(b+d.prot.length*9e5,20));p-=20}
 if(r()<.45)d.run.push(e(b,Math.round((2+r()*4)*2)/2));if(r()<.7)d.read.push(e(b,Math.ceil(r()*10)));
 ['b','l','s','d'].forEach(m=>d.meals[m]=r()<.8);d.bed=r()<.75;const wk=390+Math.round(r()*90);d.wake=`0${Math.floor(wk/60)}:${String(wk%60).padStart(2,'0')}`;
 const sb=1380+Math.round(r()*60);d.sb=`${String(Math.floor(sb/60)%24).padStart(2,'0')}:${String(sb%60).padStart(2,'0')}`;d.gym=dow(k)<6&&r()<.8;d.self=r()<.7?Math.round(r()*60):0;
 if(d.gym)S.hist.push({date:k,name:S.sched[dow(k)].n,ex:[{n:'Main lift',sets:[{w:60,r:10},{w:60,r:10},{w:60,r:8}]}]});
 S.days[k]=d;S.tasks.push({id:'d'+i,title:'Task '+i,done:r()<.8,pri:'Medium',due:k,cat:'Work'})}
 S.demo=true;S.tasks.push({id:'t1',title:'Finish marketing presentation',done:false,pri:'High',due:T0(),cat:'Work',top:true},{id:'t2',title:'Call client',done:false,pri:'High',due:T0(),cat:'Work',top:true},{id:'t3',title:'Buy groceries',done:false,pri:'Low',due:T0(),cat:'Personal'})}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S){S=fresh();demo(S)}
let V='home',R=7,SEL=null,TF='today',W=null,SW=null,ERR=0;
document.documentElement.dataset.t=S.set.theme;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast("Couldn't save your entry. Your data is still in memory; export it from Settings.")}}
function toast(m){const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
const D=k=>S.days[k]||{water:[],prot:[],run:[],read:[],meals:{},custom:{}};
const Wr=k=>S.days[k]||(S.days[k]={water:[],prot:[],run:[],read:[],meals:{},custom:{}});
const wl=a=>{const t=a.reduce((s,x)=>s+x,0);return t||1};
function score(k){const d=D(k),w=S.set.w,tk=S.tasks.filter(t=>t.due===k),sc=S.sched[dow(k)];
 const p={wake:d.wake?1:0,bed:d.bed?1:0,water:Math.min(1,sum(d.water)/S.set.waterGoal),run:Math.min(1,sum(d.run)/S.set.runGoal),work:tk.length?tk.filter(t=>t.done).length/tk.length:0,gym:d.gym||sc.n==='Rest'?1:0,read:Math.min(1,sum(d.read)/S.set.readGoal),self:Math.min(1,(d.self||0)/30),prot:Math.min(1,sum(d.prot)/S.set.protGoal)};
 return Math.round(Object.keys(w).reduce((s,x)=>s+w[x]*p[x],0)/wl(Object.values(w))*100)}
function streak(){let n=0,k=T0();if(score(k)<50)k=addD(k,-1);while(S.days[k]&&score(k)>=50){n++;k=addD(k,-1)}return n}
function best(){const ks=Object.keys(S.days).sort();let b=0,c=0;ks.forEach(k=>{c=score(k)>=50?c+1:0;b=Math.max(b,c)});return b}
const keys=n=>Array.from({length:n},(_,i)=>addD(T0(),-(n-1-i)));
const rs=(key,n)=>keys(n).reduce((s,k)=>s+sum(D(k)[key]),0);
const fw=v=>v>=1000?(v/1000).toFixed(2).replace(/0$/,'')+' L':v+' ml',fk=v=>+v.toFixed(1)+' km',fg=v=>v+' g',fp=v=>v+(v==1?' page':' pages');
function ring(p,sz,big,sub,c='var(--a)'){const r=44,L=2*Math.PI*r;return`<svg width="${sz}" height="${sz}" viewBox="0 0 100 100" role="img" aria-label="${big} ${sub}"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--in)" stroke-width="9"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-Math.min(1,p))}" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset .6s"/><text x="50" y="52" text-anchor="middle" fill="var(--tx)" font-size="24" font-weight="700">${big}</text><text x="50" y="68" text-anchor="middle" fill="var(--mu)" font-size="11">${sub}</text></svg>`}
function bars(v,goal,c='var(--p)'){const m=Math.max(goal||0,...v,1),n=v.length,w=300/n;return`<svg viewBox="0 0 300 70" width="100%" role="img" aria-label="Bar chart">${v.map((x,i)=>`<rect x="${i*w+w*.15}" y="${68-x/m*64}" width="${w*.7}" height="${x/m*64}" rx="2" fill="${c}"/>`).join('')}${goal?`<line x1="0" x2="300" y1="${68-goal/m*64}" y2="${68-goal/m*64}" stroke="var(--w)" stroke-dasharray="4 3"/>`:''}</svg>`}
function line(v){const m=Math.max(...v,1),n=v.length;return`<svg viewBox="0 0 300 70" width="100%" role="img" aria-label="Score trend"><polyline fill="none" stroke="var(--s)" stroke-width="2.5" points="${v.map((x,i)=>`${i*300/Math.max(1,n-1)},${68-x/m*64}`).join(' ')}"/></svg>`}
const chk=(on,a,x='')=>`<button class="chk ${on?'on':''}" data-a="${a}" ${x} aria-pressed="${!!on}" aria-label="Toggle">${on?'✓':''}</button>`;
const hi=(key,f,k)=>{const a=D(k)[key];return a.length?`<details><summary>History (${a.length})</summary>${a.map((e,i)=>`<div class="h"><span>${tm(e.t)} — ${f(e.v)}</span><button data-a="del" data-k="${key}" data-i="${i}" aria-label="Delete entry">×</button></div>`).join('')}</details>`:''};
function ctr(key,lab,goal,btns,f,extra=''){const T=T0(),t=sum(D(T)[key]);return`<section class="card ${t>=goal?'done':''}"><div class="row"><b>${lab}</b><span class="mu">${f(t)} / ${f(goal)}</span></div><div class="bar"><i style="width:${Math.min(100,t/goal*100)}%"></i></div><div class="btns">${btns.map(v=>`<button data-a="add" data-k="${key}" data-v="${v}" class="${v>0&&v==btns[btns.length-1]?'pr':''}">${v<0?'−':'+'}${f(Math.abs(v))}</button>`).join('')}<button data-a="cust" data-k="${key}">Custom</button><button data-a="undo" data-k="${key}" aria-label="Undo last">↶</button></div>${extra?`<div class="mu" style="margin-top:8px">${extra}</div>`:''}${hi(key,f,T)}</section>`}
function vHome(){const T=T0(),d=D(T),sc=score(T),h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',sch=S.sched[dow(T)],rest=sch.n==='Rest';
 const tk=S.tasks.filter(t=>t.due===T),bd=d.sb&&d.wake?hm((mins(d.wake)-mins(d.sb)+1440)%1440):'—',cs=S.habits;
 const done=[d.wake,d.bed,sum(d.water)>=S.set.waterGoal,d.gym||rest,sum(d.read)>=S.set.readGoal,sum(d.prot)>=S.set.protGoal].filter(Boolean).length;
 return`<div class="v"><div class="row"><div><h1>${g}, ${S.set.name} 👋</h1><div class="mu">${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div><div style="margin-top:8px">🔥 ${streak()} day streak · best ${best()}</div></div><div>${ring(sc/100,104,sc,"/ 100")}</div></div>
 <div class="mu" style="margin:6px 2px">${done}/6 key habits done today. Every bit counts.</div>
 ${S.inbox.length?`<button class="card ai" style="width:100%;text-align:left" data-a="nav" data-v="ai">${S.inbox.length} AI suggestion${S.inbox.length>1?'s':''} waiting for your review</button>`:''}
 <h2>Morning</h2><div class="cols"><section class="card"><div class="row"><div><b>Wake up</b><div class="big">${d.wake||'--:--'}</div></div><div style="width:120px"><button class="pr" style="width:100%" data-a="wake">Log now</button><input type="time" aria-label="Wake time" data-c="wake" value="${d.wake||''}" style="margin-top:6px"></div></div></section>
 <section class="card"><div class="row"><div><b>Sleep</b><div class="big">${bd}</div></div><label class="mu" style="width:120px">Bedtime<input type="time" data-c="sb" value="${d.sb||''}"></label></div></section>
 <section class="card ${d.bed?'done':''}"><div class="row"><b>Make bed</b>${chk(d.bed,'bed')}</div></section>${ctr('water','Water',S.set.waterGoal,[-250,250,500],fw)}</div>
 <h2>Activity</h2><div class="cols">${ctr('run','Running',S.set.runGoal,[.5,1,2],fk,`Week ${fk(rs('run',7))} · Month ${fk(rs('run',30))}`)}
 <section class="card"><div class="row"><b>Work</b><span class="mu">${tk.filter(t=>t.done).length} / ${tk.length} tasks</span></div>${tk.length?tk.map(t=>`<div class="row" style="margin-top:8px"><span style="${t.done?'text-decoration:line-through;color:var(--mu)':''}">${t.title}</span>${chk(t.done,'tdone',`data-i="${t.id}"`)}</div>`).join(''):'<div class="mu" style="margin-top:8px">Nothing urgent today.</div>'}</section></div>
 <h2>Fitness</h2><div class="cols"><section class="card"><div class="row"><div><b>Today's workout</b><div class="big" style="font-size:20px">${rest?'Rest day':sch.n}</div></div>${rest?'':d.gym?'<span style="color:var(--a)">✓ Complete</span>':'<button class="pr" data-a="startw">Start workout</button>'}</div></section>
 ${ctr('prot','Protein',S.set.protGoal,[10,15,20],fg,`Week avg ${Math.round(rs('prot',7)/7)} g`)}
 <section class="card"><b>Meals</b><div class="btns">${[['b','Breakfast'],['l','Lunch'],['s','Snacks'],['d','Dinner']].map(([m,l])=>`<button data-a="meal" data-v="${m}" class="${d.meals[m]?'ok':''}" aria-pressed="${!!d.meals[m]}">${d.meals[m]?'✓ ':''}${l}</button>`).join('')}</div></section></div>
 <h2>Growth</h2><div class="cols">${ctr('read',S.set.lab.read,S.set.readGoal,[1,5,10],fp,`Week ${rs('read',7)} · Month ${rs('read',30)} pages`)}
 <section class="card"><div class="row"><b>${S.set.lab.self}</b><span class="mu">${d.self||0} min today</span></div><div class="btns">${S.selfStart?`<button class="ok" data-a="selfend">Complete</button>`:`<button class="pr" data-a="selfstart">Start</button>`}<button data-a="selfadd">+15 min</button></div></section>
 ${cs.map(h=>`<section class="card ${d.custom[h.id]?'done':''}"><div class="row"><b>${h.title}</b>${chk(d.custom[h.id],'cust2',`data-i="${h.id}"`)}</div></section>`).join('')}</div></div>`}
function vStats(){const ks=R==='All'?keys(Math.max(7,Object.keys(S.days).length+1)):keys(R),n=ks.length,wv=ks.map(k=>sum(D(k).water)),sl=ks.filter(k=>D(k).sb&&D(k).wake).map(k=>(mins(D(k).wake)-mins(D(k).sb)+1440)%1440),wk=ks.filter(k=>D(k).wake).map(k=>mins(D(k).wake)),sd=ks.map(score),g=ks.filter(k=>D(k).gym);
 const mg={};g.forEach(k=>S.hist.filter(h=>h.date===k).forEach(h=>h.name.split(/[+\/]/).forEach(m=>{m=m.trim();mg[m]=(mg[m]||0)+1})));const sdv=Math.sqrt(avg(sl.map(x=>(x-avg(sl))**2)));
 const c=(t,m,ch)=>`<section class="card"><b>${t}</b><div class="mu">${m}</div>${ch}</section>`;
 const st=T0(),hs=addD(st,-(dow(st)+28)),cells=Array.from({length:35},(_,i)=>addD(hs,i)),sel=SEL&&D(SEL);
 return`<div class="v"><h1>Your progress</h1><div class="tabs" role="tablist">${[7,30,90,'All'].map(r=>`<button class="${R===r?'on':''}" data-a="range" data-v="${r}">${r==='All'?'All time':r+'d'}</button>`).join('')}</div><div class="cols">
 ${c('Daily score',`Average ${Math.round(avg(sd))} / 100`,line(sd))}
 ${c('Water',`Avg ${fw(Math.round(avg(wv)))} · goal met ${Math.round(wv.filter(v=>v>=S.set.waterGoal).length/n*100)}% · best ${fw(Math.max(...wv))}`,bars(wv,S.set.waterGoal))}
 ${c('Sleep',sl.length?`Avg ${hm(avg(sl))} · wake ${hm(avg(wk)).replace('h ',':').replace('m','')} · consistency ±${Math.round(sdv)} min`:'No sleep logged yet.',bars(ks.map(k=>D(k).sb&&D(k).wake?(mins(D(k).wake)-mins(D(k).sb)+1440)%1440:0),480,'var(--s)'))}
 ${c('Running',`${fk(rs('run',n))} total · ${ks.filter(k=>D(k).run.length).length} runs`,bars(ks.map(k=>sum(D(k).run)),S.set.runGoal,'var(--a)'))}
 ${c('Gym',`${g.length} workouts · ${Math.round(g.length/n*7*10)/10} per week`,Object.keys(mg).length?Object.entries(mg).map(([m,v])=>`<div class="row mu"><span style="width:90px">${m}</span><div class="bar" style="flex:1;margin:4px 0"><i style="width:${v/Math.max(...Object.values(mg))*100}%;background:var(--s)"></i></div><span>${v}</span></div>`).join(''):'<div class="mu">No workouts in this range.</div>')}
 ${c('Protein',`Avg ${Math.round(rs('prot',n)/n)} g · goal met ${Math.round(ks.filter(k=>sum(D(k).prot)>=S.set.protGoal).length/n*100)}%`,bars(ks.map(k=>sum(D(k).prot)),S.set.protGoal,'var(--w)'))}
